{% extends 'base.html' %}
{% block title %}Register | Syncora{% endblock %}
{% block content %}
<main class="hero">
  <h1>Create your account</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Register</button>
  </form>
  <p>Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</main>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Log in | Syncora{% endblock %}
{% block content %}
<main class="hero">
  <h1>Welcome back</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log in</button>
  </form>
  <p>New here? <a href="{% url 'register' %}">Create an account</a></p>
</main>
{% endblock %}
